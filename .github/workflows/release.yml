# Build & publish MQ GUI for Windows / macOS / Linux when a version tag is pushed.
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#
#   macOS code signing + notarization
#   ---------------------------------
#   APPLE_CERTIFICATE            Base64 of Developer ID Application .p12
#                                openssl base64 -A -in cert.p12 -out cert-base64.txt
#   APPLE_CERTIFICATE_PASSWORD   Password used when exporting the .p12
#   APPLE_ID                     Apple ID email
#   APPLE_PASSWORD               App-specific password
#                                (appleid.apple.com → Sign-In and Security → App-Specific Passwords)
#   APPLE_TEAM_ID                Team ID from developer.apple.com/account → Membership
#
#   Optional:
#   APPLE_SIGNING_IDENTITY       Explicit codesign identity; inferred from certificate if omitted
#
#   Alternative notarization via App Store Connect API (instead of APPLE_ID/PASSWORD):
#   APPLE_API_ISSUER             Issuer ID
#   APPLE_API_KEY                Key ID
#   APPLE_API_KEY_CONTENT        Full contents of AuthKey_<KEYID>.p8
#
# Also ensure: Settings → Actions → General → Workflow permissions → Read and write.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0). Leave empty to use package version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION}"

      - name: Sync version from tag
        if: github.event_name == 'push' || inputs.tag != ''
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, re

          version = os.environ["VERSION"]
          for path in ("package.json", "src-tauri/tauri.conf.json"):
              p = pathlib.Path(path)
              data = json.loads(p.read_text())
              data["version"] = version
              p.write_text(json.dumps(data, indent=2) + "\n")

          cargo = pathlib.Path("src-tauri/Cargo.toml")
          text = cargo.read_text()
          text, n = re.subn(r'(?m)^version = ".*"', f'version = "{version}"', text, count=1)
          if n != 1:
              raise SystemExit("failed to update src-tauri/Cargo.toml version")
          cargo.write_text(text)
          print(f"Synced project version to {version}")
          PY

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple API key (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "${APPLE_API_KEY_CONTENT}" ] || [ -z "${APPLE_API_KEY}" ]; then
            echo "APPLE_API_KEY_CONTENT not set; using Apple ID notarization if configured."
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/private_keys"
          KEY_PATH="${RUNNER_TEMP}/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=${RUNNER_TEMP}/private_keys" >> "$GITHUB_ENV"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing — Tauri imports APPLE_CERTIFICATE and infers identity
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization via Apple ID + app-specific password
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via App Store Connect API (alternative)
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: MQ GUI ${{ steps.meta.outputs.tag }}
          releaseBody: |
            ## MQ GUI ${{ steps.meta.outputs.tag }}

            Download the installer for your platform from the assets below.

            - **macOS Apple Silicon** — `.dmg` (`aarch64-apple-darwin`)
            - **macOS Intel** — `.dmg` (`x86_64-apple-darwin`)
            - **Windows** — `.msi` / NSIS `.exe`
            - **Linux** — `.AppImage` / `.deb`
          releaseDraft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          args: ${{ matrix.args }}
