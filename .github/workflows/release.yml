name: Release

# 推送任意 tag 时编译并发布 Windows / macOS / Linux 安装包
#
# Required repository secrets (同 es-gui):
#   APPLE_CERTIFICATE            Developer ID Application .p12 的单行 base64
#   APPLE_CERTIFICATE_PASSWORD   导出 .p12 时的密码
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   公证用
# Optional:
#   APPLE_SIGNING_IDENTITY       一般可省略；本 workflow 会从证书自动解析
#
on:
  push:
    tags:
      - '*'

jobs:
  publish:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # es-gui 可直接把 .p12 交给 Tauri；本仓库证书会被 Apple security 以
      # "MAC verification failed (wrong password?)" 拒绝（密码其实往往是对的）。
      # 先用 OpenSSL 校验密码，再导出 Apple 兼容 PKCS12 并导入 CI 钥匙串，
      # 只把 APPLE_SIGNING_IDENTITY 交给 tauri-action，避免二次 security import。
      - name: Prepare Apple signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: quay-ci-keychain
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::Missing APPLE_CERTIFICATE or APPLE_CERTIFICATE_PASSWORD"
            exit 1
          fi

          CERT="$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n\r[:space:]')"
          PASS="$(printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "APPLE_CERTIFICATE_PASSWORD length=${#PASS}"
          echo "APPLE_CERTIFICATE base64 length=${#CERT}"

          RAW="${RUNNER_TEMP}/apple-raw.p12"
          PEM="${RUNNER_TEMP}/apple.pem"
          OUT="${RUNNER_TEMP}/apple-compat.p12"
          printf '%s' "$CERT" | base64 --decode > "$RAW"
          echo "Decoded .p12 size=$(wc -c < "$RAW" | tr -d ' ') bytes"

          EXTRACTED=0
          for ARGS in "" "-legacy"; do
            # shellcheck disable=SC2086
            if openssl pkcs12 -in "$RAW" -passin "pass:${PASS}" -nodes -out "$PEM" $ARGS \
              2>"${RUNNER_TEMP}/pkcs12.err"; then
              EXTRACTED=1
              echo "OpenSSL decrypted PKCS12${ARGS:+ ($ARGS)} — password matches certificate"
              break
            fi
          done
          if [ "$EXTRACTED" -ne 1 ]; then
            echo "::error::Password does not decrypt APPLE_CERTIFICATE."
            echo "Re-export .p12 and set BOTH secrets from the same file:"
            echo "  openssl base64 -A -in cert.p12 | pbcopy"
            echo "OpenSSL said:"
            cat "${RUNNER_TEMP}/pkcs12.err" || true
            exit 1
          fi

          # Apple security 对默认 OpenSSL3 PKCS12 常报 MAC verification failed
          openssl pkcs12 -export -in "$PEM" -out "$OUT" -passout "pass:${PASS}" \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1

          KC="${RUNNER_TEMP}/quay.build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')

          if ! security import "$OUT" -P "$PASS" -A -t cert -f pkcs12 -k "$KC" \
            2>"${RUNNER_TEMP}/security.err"; then
            echo "::error::security import failed even after Apple-compatible re-export"
            cat "${RUNNER_TEMP}/security.err" || true
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security find-identity -v -p codesigning "$KC"

          IDENTITY="$(security find-identity -v -p codesigning "$KC" \
            | awk -F'"' '/Developer ID Application|Apple Distribution|Apple Development/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No codesigning identity found after import"
            exit 1
          fi

          {
            echo "APPLE_SIGNING_IDENTITY<<EOF"
            echo "$IDENTITY"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Using signing identity: $IDENTITY"

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不要传 APPLE_CERTIFICATE / PASSWORD（即使是空字符串）：
          # Tauri 只要看到这两个变量就会再调 security import，空值会报
          # "One or more parameters passed to a function were not valid."
          # 证书已在上一步导入钥匙串，这里只传 identity + 公证账号。
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quay ${{ github.ref_name }}
          releaseBody: |
            ## Quay ${{ github.ref_name }}

            下载对应平台安装包：

            | 平台 | 产物 |
            | --- | --- |
            | Windows | `.msi` / `.exe` (NSIS) |
            | macOS (Apple Silicon) | `.dmg` / `.app.tar.gz` (aarch64) |
            | macOS (Intel) | `.dmg` / `.app.tar.gz` (x86_64) |
            | Linux | `.deb` / `.AppImage` |

            产品说明：`PRODUCT.md`。使用说明：`USER_GUIDE.md`。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
